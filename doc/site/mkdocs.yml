site_name: neurosuite-3 documentation
site_description: User handbook and developer references for neurosuite-3
# Where the site is published.  Needed for 404.html: GitHub Pages serves it for
# any missing path (e.g. /neurosuite-3/handbook/), and without site_url MkDocs
# writes its asset links as /assets/..., outside the project's /neurosuite-3/,
# so the error page showed unstyled.
site_url: https://gravios.github.io/neurosuite-3/
docs_dir: docs
use_directory_urls: true

# GitHub integration: header link back to the repo. The per-page "edit" button is
# disabled on purpose (edit_uri: "") — the handbook pages are generated from the
# DocBook source and the developer pages are symlinks, so an in-site edit link
# would point at the wrong file. In production, point edit_uri at the real
# sources (and/or split authored vs generated pages).
repo_url: https://github.com/Gravios/neurosuite-3
repo_name: Gravios/neurosuite-3
edit_uri: ""

# The handbook's own links are verified at generation time (split_rewrite.py
# hard-fails on a broken anchor), so link checking here is informational. The
# messages that remain come from the developer docs, which are symlinked in
# as-is and still carry repo-relative links/anchors (to ARCHITECTURE.md, other
# src/*/docs files, GitHub-style numbered anchors) — see README.md "Known gaps".
validation:
  links:
    not_found: info
    anchors: info
    absolute_links: info
    unrecognized_links: info

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.follow
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - hooks.py           # links that leave the site point to the file on GitHub
markdown_extensions:
  - attr_list          # honour {#id} heading/anchor ids from the converter
  - md_in_html         # honour the injected <a id="..."> anchors
  - def_list           # the Settings / Menu-Entries definition lists
  - admonition         # the "!!! note" callouts converted from DocBook <note>
  - tables
  - toc:
      permalink: true
      # GitHub-style heading ids, so anchors written for the repository
      # (#ndm_pca--per-channel-pca-spk--fet-pca) resolve on the site too.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details

nav:
  - Home: index.md
  - Getting started:
      - Installation: INSTALL.md
      - First-time spike sort: workflows/first-time-sort.md
      - Glossary: GLOSSARY.md
  - Klusters:
      - Klusters manual: klusters/README.md
      - Cluster sorting: klusters/cluster-sorting.md
      - Hierarchical clustering: klusters/hierarchical-clustering.md
      - Spike realignment: spikerealign/README.md
  - NeuroScope:
      - Introduction: handbook/01-introduction.md
      - Using NeuroScope: handbook/02-using-neuroscope.md
      - Settings: handbook/03-settings.md
      - File Formats: handbook/04-file-formats.md
      - Menu Entries: handbook/05-menu-entries.md
      - Credits & License: handbook/06-credits-and-license.md
      - Installation: handbook/07-installation.md
      - Reference: neuroscope/README.md
  - NDManager: ndmanager/README.md
  - Processing pipeline:
      - Overview: ndmanager-plugins/README.md
      - The pipeline: ndmanager-plugins/pipeline.md
      - Parameters: ndmanager-plugins/parameters.md
      - Commands: ndmanager-plugins/commands/README.md
      - File formats: ndmanager-plugins/formats/README.md
  - KiloKlustaKwik: kiloklustakwik/README.md
  - Workflows:
      - Overview: workflows/README.md
      - Cluster curation: workflows/cluster-curation.md
      - Iterative refinement: workflows/iterative-refinement.md
      - Re-extract at a lower threshold: workflows/re-extract-lower-threshold.md
      - Drift correction: workflows/drift-correction.md
      - Collision decomposition: workflows/collision-decomposition.md
      - Empirical priors: workflows/empirical-priors.md
  - GPU acceleration: gpu/README.md
  - Developer:
      - Developer guide: dev/DEVELOPER_GUIDE.md
      - Build options: BUILD.md
      - Architecture: dev/ARCHITECTURE.md
      - Standards: dev/STANDARDIZATION.md
      - Recipes: dev/RECIPES.md
      - Roadmap: dev/ROADMAP.md
      - Plugins roadmap: dev/PLUGINS-ROADMAP.md
      - Design notes: design/README.md
      - Input system — Klusters: developer/klusters-input-system.md
      - Input system — NeuroScope: developer/neuroscope-input-system.md
      - Klusters plugin API: developer/plugin-api.md
  - Changelog: CHANGELOG.md
