# ---------------------------------------------------------------------------
# Continuous integration on macOS (Apple silicon, Homebrew).  One workflow per
# operating system so each has its own status badge in README.md; see
# ci-linux.yml.
# ---------------------------------------------------------------------------
name: macos

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'doc/**', 'templates/**', 'CMakeLists.txt', 'cmake/**', 'scripts/**', '.github/workflows/ci-macos.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'doc/**', 'templates/**', 'CMakeLists.txt', 'cmake/**', 'scripts/**', '.github/workflows/ci-macos.yml']
  workflow_dispatch:

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS on Apple silicon with Homebrew, the way doc/INSTALL.md installs it:
  # Qt 6, yaml-cpp, GSL, libomp (Apple's clang has no OpenMP of its own),
  # libsamplerate, FFmpeg, HDF5 and bash 4+ (macOS ships bash 3.2, and the
  # ndm_* scripts need 4).  GPU backends off; NS_NATIVE_ARCH=OFF, since the
  # x86 -march tuning does not apply.  Everything is built, KiloKlustaKwik
  # and the plugins included; -k 0 lists every compile error in one run.  The
  # tests run but do not fail the job yet (continue-on-error on the step):
  # bash 4 is first on PATH, which covers the test scripts (#!/usr/bin/env
  # bash), but the ndm_* scripts start with #!/bin/bash, macOS's 3.2, so the
  # tests that run them directly are expected to fail until they use
  # #!/usr/bin/env bash; then drop the step's continue-on-error.  The badge
  # in README.md therefore reports the build.
  macos:
    name: build (macos-15, Apple clang, Homebrew Qt6)
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Check out fiber-kit (for core_shared_contract)
        uses: actions/checkout@v7
        with:
          repository: Gravios/fiber-kit
          path: .fiber-kit

      - name: Install dependencies (Homebrew)
        run: |
          brew install ninja pkg-config qt@6 yaml-cpp gsl libomp \
            libsamplerate ffmpeg hdf5 bash
          # bash 4+ first on PATH for the ndm_* scripts and their tests.
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python packages (the Python steps and their tests)
        run: python -m pip install pyyaml numpy scipy

      - name: Toolchain versions
        run: |
          sw_vers
          clang --version | head -1; cmake --version | head -1
          bash --version | head -1
          echo "Qt $(brew list --versions qt@6)"; echo "libomp $(brew list --versions libomp)"

      - name: Configure (GPU backends off; portable; warnings on, non-fatal; tests on)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_SYCL=OFF \
            -DNS_NATIVE_ARCH=OFF \
            -DNS_BUILD_TESTS=ON \
            -DNS_FIBER_KIT_ROOT="$GITHUB_WORKSPACE/.fiber-kit" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix)" \
            -DOpenMP_ROOT="$(brew --prefix libomp)" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wshadow"

      # -k 0: keep going, so one run lists every compile error.
      - name: Build
        run: cmake --build build --parallel -- -k 0

      # Apple Accelerate (vDSP real FFT, BLAS pow3 kernel): the only code
      # built for macOS alone, so it is checked here and nowhere else.  Each
      # test checks every provider against a direct computation and prints
      # its timing; required to pass, unlike the full suite below.
      - name: Test the Accelerate paths (vDSP FFT, BLAS kernel)
        run: ctest --test-dir build --output-on-failure -V -R '^(core_test_spectral|ndm_test_extractemg_pow3)$'

      # The Metal backend (USE_METAL, on by default): the context and the
      # ported plugins, each against its CPU path.  Each prints SKIPPED when the runner
      # exposes no Metal device; the build itself proves the host code and
      # the metal-cpp fetch.
      - name: Test the Metal backend (context and the ported plugins)
        run: ctest --test-dir build --output-on-failure -V -R '^(core_test_metal|ndm_test_(medianthreshold_metal|medianfilter|butterworth|spikegrouper_metal))$'

      - name: Time the pow3 kernels at a realistic size (informational)
        continue-on-error: true
        run: |
          bin=$(find build -name process_extractemg_pow3_test -type f -perm -u+x | head -1)
          "$bin" --bench 2000000 32

      - name: Test (informational for now)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --parallel 4
