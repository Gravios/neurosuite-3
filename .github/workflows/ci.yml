# ---------------------------------------------------------------------------
# Continuous integration — CPU build and test gate.
#
# Builds the whole monorepo on the documented Ubuntu 24.04 toolchain with the
# GPU backends disabled (GitHub runners have no CUDA / HIP / SYCL device), so it
# exercises the CPU / OpenMP path that every GPU backend falls back to.  The
# job's purpose is to catch build-breaking regressions before they land and to
# surface -Wall -Wextra -Wshadow diagnostics in the build log.  It then runs the
# regression suite (NS_BUILD_TESTS=ON, ctest; see tests/README.md), including
# the ndmanager-plugins script tests and core_shared_contract, which compares
# the vector tables shared with fiber-kit against a fiber-kit checkout.
#
# Warnings are NOT errors here.  To promote -Wshadow to a hard gate that locks
# in the m_-prefix audit, append -Werror=shadow to CMAKE_CXX_FLAGS below — but
# only after confirming a green baseline locally: klusters and libklustersshared
# are shadow-clean (see STANDARDIZATION.md), whereas kiloklustakwik, ndmanager
# and neuroscope have not been shadow-audited yet and may still emit -Wshadow
# warnings that would fail the build.  When a slot signature genuinely needs it,
# silence -Wunused-parameter at that site with a scoped
# `#pragma GCC diagnostic ignored "-Wunused-parameter"` rather than disabling the
# warning globally.
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'doc/**', 'templates/**', 'CMakeLists.txt', 'cmake/**', 'scripts/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'doc/**', 'templates/**', 'CMakeLists.txt', 'cmake/**', 'scripts/**', '.github/workflows/ci.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds, no build: shell syntax, Python defects, build-system invariants.
  # The same script runs locally (scripts/lint.sh).
  lint:
    name: lint (bash -n, ruff, build invariants)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff and zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
          python -m pip install ruff==0.16.8
      - name: Lint
        run: scripts/lint.sh

  build:
    name: build (ubuntu-24.04, CPU, Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The shared vector tables must match fiber-kit's copies.
      - name: Check out fiber-kit (for core_shared_contract)
        uses: actions/checkout@v4
        with:
          repository: Gravios/fiber-kit
          path: .fiber-kit   # hidden: kept out of repo-wide scans (test_docs.py)

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            qt6-base-dev qt6-tools-dev libqt6svg6-dev \
            libgl-dev libxkbcommon-dev libxcb-cursor0 \
            libyaml-cpp-dev libxml2-dev libgsl-dev \
            libhdf5-dev libsamplerate0-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            ffmpeg python3 python3-yaml python3-numpy python3-scipy

      - name: Configure (GPU backends off; warnings on, non-fatal; tests on)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_SYCL=OFF \
            -DNS_BUILD_TESTS=ON \
            -DNS_FIBER_KIT_ROOT="$GITHUB_WORKSPACE/.fiber-kit" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wshadow"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen   # Qt tests run without a display
        run: ctest --test-dir build --output-on-failure --parallel 4
