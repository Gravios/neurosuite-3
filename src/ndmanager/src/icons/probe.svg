<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  application-nphys-probe.svg
  64×64 icon for ndmanager's "Probes" parameter tree entry.

  Geometry is a faithful 2× upscaling of probe.png (32×32):
    – connector block   rows 0-5    (2× of rows 0-2)
    – silicon shank     rows 6-53   (2× of rows 3-26, 6 px wide)
    – pointed tip       rows 54-63  (2× of rows 27-31)
    – 8 electrode sites in alternating L/R pattern:
        left  cx=22  cy=8,20,32,44   (channels 0,2,4,6)
        right cx=40  cy=6,14,26,38   (channels 1,3,5,7)
      Row cy=6 has both left and right simultaneously, matching probe.png row 3.

  Palette mirrors probe.png: blue (#4060a0 family) + gold (#c0a020 family).
-->
<svg
   xmlns="http://www.w3.org/2000/svg"
   version="1.1"
   width="64"
   height="64"
   viewBox="0 0 64 64">

  <defs>
    <!-- Shank/connector gradient: light centre, dark edges -->
    <linearGradient id="shankGrad" x1="0" y1="0" x2="1" y2="0"
                    gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#243860"/>
      <stop offset="40%"  stop-color="#6080b4"/>
      <stop offset="60%"  stop-color="#6080b4"/>
      <stop offset="100%" stop-color="#243860"/>
    </linearGradient>
    <linearGradient id="connGrad" x1="0" y1="0" x2="1" y2="0"
                    gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#182844"/>
      <stop offset="35%"  stop-color="#405c88"/>
      <stop offset="65%"  stop-color="#405c88"/>
      <stop offset="100%" stop-color="#182844"/>
    </linearGradient>
    <!-- Gold contact: warm radial highlight -->
    <radialGradient id="eGrad" cx="36%" cy="36%" r="56%">
      <stop offset="0%"   stop-color="#f0d860"/>
      <stop offset="55%"  stop-color="#c09818"/>
      <stop offset="100%" stop-color="#7c5c08"/>
    </radialGradient>
  </defs>

  <!-- ── Connector housing (22 × 6 px, x=22..43, y=0..5) ──────────────── -->
  <rect x="22" y="0" width="22" height="6" rx="1.5"
        fill="url(#connGrad)" stroke="#101828" stroke-width="1.2"/>

  <!-- Bond-wire pads: 4 gold lines matching 8-ch pairs (2 ch per gap) -->
  <line x1="26" y1="1"  x2="26" y2="5" stroke="#c8a020" stroke-width="2"/>
  <line x1="30" y1="1"  x2="30" y2="5" stroke="#c8a020" stroke-width="2"/>
  <line x1="36" y1="1"  x2="36" y2="5" stroke="#c8a020" stroke-width="2"/>
  <line x1="40" y1="1"  x2="40" y2="5" stroke="#c8a020" stroke-width="2"/>

  <!-- ── Silicon shank (6 × 48 px, x=30..35, y=6..53) ─────────────────── -->
  <rect x="30" y="5" width="6" height="50" rx="1"
        fill="url(#shankGrad)" stroke="#101828" stroke-width="1.2"/>

  <!-- ── Pointed tip (triangle, y=54..63) ──────────────────────────────── -->
  <polygon points="30,55 36,55 33,63"
           fill="#243860" stroke="#101828"
           stroke-width="1.2" stroke-linejoin="round"/>

  <!-- ── Electrode contact sites ───────────────────────────────────────── -->
  <!--
    2× scaled from probe.png stagger pattern.
    Left (cx=22) and right (cx=40) contacts are outside the shank edges
    at x=30 (left edge) and x=36 (right edge), matching the pixel layout.
    Contact radius 3 px (probe.png contact blobs are 3 px wide → 6 px at 2×,
    radius = 3 px = half of that).
  -->

  <!-- Left contacts: cy = 8, 20, 32, 44 -->
  <circle cx="22" cy="8"  r="3" fill="url(#eGrad)" stroke="#6a4808" stroke-width="1"/>
  <circle cx="22" cy="20" r="3" fill="url(#eGrad)" stroke="#6a4808" stroke-width="1"/>
  <circle cx="22" cy="32" r="3" fill="url(#eGrad)" stroke="#6a4808" stroke-width="1"/>
  <circle cx="22" cy="44" r="3" fill="url(#eGrad)" stroke="#6a4808" stroke-width="1"/>

  <!-- Right contacts: cy = 6 (shared with first left row), 14, 26, 38 -->
  <!-- cy=6 is the "both-sides" row from probe.png row 3 -->
  <circle cx="40" cy="6"  r="3" fill="url(#eGrad)" stroke="#6a4808" stroke-width="1"/>
  <circle cx="40" cy="14" r="3" fill="url(#eGrad)" stroke="#6a4808" stroke-width="1"/>
  <circle cx="40" cy="26" r="3" fill="url(#eGrad)" stroke="#6a4808" stroke-width="1"/>
  <circle cx="40" cy="38" r="3" fill="url(#eGrad)" stroke="#6a4808" stroke-width="1"/>

</svg>
