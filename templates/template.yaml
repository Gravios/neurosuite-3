# neurosuite-3 session parameter template
# Copy to SESSION/SESSION.yaml and fill in the fields marked with ~ or null.
# Fields with a concrete value show the recommended default; change as needed.
#
# Keys read by the ndmanager-plugins scripts are annotated with the plugin name
# that reads them.  "Required by" = script aborts if missing; "Optional" = has
# a built-in default.

parameters:
  version: '1.0'
  creator: ndManager-

# ─────────────────────────────────────────────────────────────────────────────
# General information
# ─────────────────────────────────────────────────────────────────────────────
generalInfo:
  date: ~                  # YYYY-MM-DD
  experimenters: ~
  description: ~
  notes: ~

# ─────────────────────────────────────────────────────────────────────────────
# Acquisition system
# Required by: most pipeline scripts (ndm_hipass, ndm_extractspikes, ndm_pca…)
# ─────────────────────────────────────────────────────────────────────────────
acquisitionSystem:
  nBits: 16
  nChannels: ~             # total number of recorded channels
  samplingRate: ~          # Hz, e.g. 20000 or 32552
  voltageRange: 20         # mV
  amplification: 1000
  offset: 0

# ─────────────────────────────────────────────────────────────────────────────
# LFP / field potentials
# Required by: NeuroScope (display only)
# ─────────────────────────────────────────────────────────────────────────────
fieldPotentials:
  lfpSamplingRate: 1250    # Hz; must match ndm_lfp > samplingRate

# ─────────────────────────────────────────────────────────────────────────────
# Extra files produced during pre-processing
# ─────────────────────────────────────────────────────────────────────────────
files:
- samplingRate: 1250
  extension: lfp

# ─────────────────────────────────────────────────────────────────────────────
# Probe library entries
# Read by: ndm_estimatedrift, ndm_decomposecollisions (site geometry)
# Also written/read by ndmanager Probe tab (parameteryamlreader_probes.cpp)
#
# id             - integer key referenced by anatomicalDescription.channelGroups
# probeFile      - path relative to the probe library search path, e.g.
#                    neuronexus/Buzsaki64.probe
# label          - free-text name for this probe in this session
# channelOffset  - first physical channel index used by this probe (0-based)
# anatomicalGroups - list of anatomicalDescription group indices (1-based)
#                    that belong to this probe
# ─────────────────────────────────────────────────────────────────────────────
probes:
- id: 0
  probeFile: ~             # e.g. neuronexus/Buzsaki64.probe
  label: ~                 # e.g. left CA1
  channelOffset: 0
  anatomicalGroups: [1, 2] # extend to match actual number of groups

# Uncomment and repeat for additional probes:
# - id: 1
#   probeFile: ~
#   label: ~
#   channelOffset: 64
#   anatomicalGroups: [3, 4]

# ─────────────────────────────────────────────────────────────────────────────
# Anatomical channel groups
# One entry per shank (or logical electrode group).
# Read by: NeuroScope, ndm_reorderchannels, ndm_spikegrouper
#
# probeId    - matches probes[].id above (optional; enables drift geometry)
# shankIndex - 0-based shank index within the named probe
# channels   - physical channel indices; id is 0-based, skip=1 hides in NeuroScope
# ─────────────────────────────────────────────────────────────────────────────
anatomicalDescription:
  channelGroups:
  - channels:
    - {id: 0,  skip: 0}
    - {id: 1,  skip: 0}
    - {id: 2,  skip: 0}
    - {id: 3,  skip: 0}
    - {id: 4,  skip: 0}
    - {id: 5,  skip: 0}
    - {id: 6,  skip: 0}
    - {id: 7,  skip: 0}
    probeId: 0
    shankIndex: 0
  - channels:
    - {id: 8,  skip: 0}
    - {id: 9,  skip: 0}
    - {id: 10, skip: 0}
    - {id: 11, skip: 0}
    - {id: 12, skip: 0}
    - {id: 13, skip: 0}
    - {id: 14, skip: 0}
    - {id: 15, skip: 0}
    probeId: 0
    shankIndex: 1
  # Add further groups for additional shanks / probes

# ─────────────────────────────────────────────────────────────────────────────
# Spike detection groups
# Typically one entry per shank, or as updated by ndm_spikegrouper.
# Read by: ndm_extractspikes, ndm_extractspikes_sdiff, ndm_pca, ndm_klustakwik,
#          ndm_estimatedrift, ndm_decomposecollisions
#
# channels        - physical channel indices in physical probe order (tip-to-base)
# nSamples        - total waveform length in samples (e.g. 52 at 32 kHz)
# peakSampleIndex - sample index of the expected waveform peak (0-based)
# nFeatures       - PCA components per channel (used by ndm_pca / ndm_klustakwik)
# ─────────────────────────────────────────────────────────────────────────────
spikeDetection:
  channelGroups:
  - channels:        [0, 1, 2, 3, 4, 5, 6, 7]
    nSamples:        52
    peakSampleIndex: 26
    nFeatures:       3
  - channels:        [8, 9, 10, 11, 12, 13, 14, 15]
    nSamples:        52
    peakSampleIndex: 26
    nFeatures:       3
  # Add further groups to match anatomicalDescription

# ─────────────────────────────────────────────────────────────────────────────
# Manually curated units
# Populated by NeuroScope / Klusters after manual curation.
# Fields: group (1-based spikeDetection group), cluster (>=2 = single unit),
#         structure, type, isolationDistance, quality, notes -- all free-text.
# ─────────────────────────────────────────────────────────────────────────────
units:
- group: 1
  cluster: 2
  structure: ~
  type: ~
  isolationDistance: ~
  quality: ~
  notes: ~

# ─────────────────────────────────────────────────────────────────────────────
# NeuroScope display settings
# ─────────────────────────────────────────────────────────────────────────────
neuroscope:
  version: 1.2.5
  miscellaneous:
    screenGain: 0.2
    traceBackgroundImage: ~
  video:
    rotate: 0
    flip: 0
    videoImage: ~
    positionsBackground: 0
  spikes:
    nSamples: 32            # waveform window shown in NeuroScope spike view
    peakSampleIndex: 16
  # channels.colors -- per-channel color entries are generated by NeuroScope
  # and ndm_recolorchannels.  Omit here; NeuroScope will assign defaults.

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline plugin parameters
# Each entry configures one ndmanager-plugin.  Parameters with a value shown
# are the recommended defaults from the plugin source; change as needed.
# Parameters with null (shown as ~) must be filled in before running.
# ─────────────────────────────────────────────────────────────────────────────
programs:

# == Master orchestrator ======================================================
- name: ndm_start
  parameters:
  - {name: suffixes, value: nlx,     status: Mandatory}
  - {name: log,      value: 'false', status: Mandatory}
  # Optional flags -- all default true except clean.
  # Uncomment to override:
  # - {name: wideband,      value: 'true',  status: Optional}
  # - {name: video,         value: 'true',  status: Optional}
  # - {name: events,        value: 'true',  status: Optional}
  # - {name: concatenation, value: 'true',  status: Optional}
  # - {name: spikes,        value: 'true',  status: Optional}
  # - {name: lfp,           value: 'true',  status: Optional}
  # - {name: clean,         value: 'false', status: Optional}
  help: |-
    Perform all processing steps for a multiple sets of multiple-session
    recordings: format conversion, channel extraction and reordering, video
    transcoding and tracking, data concatenation, spike detection and
    extraction, etc.

    PARAMETERS

    # suffixes

    List of suffixes for the individual files to convert

    OPTIONAL PARAMETERS

    # wideband

    Process the wideband data files: convert to .dat, resample, merge, extract
    and reorder channels (default = true)

    # video

    Process video files: transcode and extract LEDs (default = true)

    # events

    Process event files: convert to .evt and rename events (default = true)

    # concatenation

    Concatenate sessions from the same day (default = true)

    # spikes

    Detect and extract spike waveforms, perform PCA (default = true)

    # lfp

    Downsample wideband signals to produce LFP files (default = true)

    # clean

    Remove intermediate files after pre-processing is complete (default = false)

    # log

    Save progress information to log files for later review
    (use 'cat' or 'less -R' for correct formatting, default = false)

# == Acquisition format converters ============================================
- name: ndm_aom2dat
  parameters:
  - {name: matFile,      value: ~,        status: Mandatory}
  - {name: chunkSamples, value: 10000000, status: Optional}
  help: |-
    Convert an AlphaOmega .mat recording (HDF5 v7.3 format) to SESSION.dat.

    Only the binary .dat file is written.  Anatomical groups and spike
    detection groups are NOT set — use the Probes tab in ndmanager or
    ndm_setupgroups after conversion to configure channel groupings.

    After conversion the session YAML is patched conservatively:
      - nChannels is updated only if it disagrees with the .dat file size
      - samplingRate is written only if not already set in the YAML

    PARAMETERS

    # matFile

    Path to the AlphaOmega .mat file, absolute or relative to the session
    directory (e.g. recording.mat).

    OPTIONAL PARAMETERS

    # chunkSamples

    Samples per streaming read chunk (default = 10000000 ≈ 610 MB for
    32 channels).  Reduce on systems with less than 32 GB RAM.

- name: ndm_ncs2dat
  parameters:
  - {name: reverse,  value: 'false', status: Mandatory}
  - {name: suffixes, value: nlx,     status: Mandatory}
  # - {name: gap,          value: 1,       status: Optional}
  # - {name: ignoreEvents, value: 'false', status: Optional}
  help: |-
    Convert from .ncs (Neuralynx files) to .dat format.

    PARAMETERS

    # reverse

    Whether the signals should be reversed (by default, NeuraLynx reverses all
    signals -- this sets them back to normal)

    # suffixes

    List of suffixes of the directories where the NCS files are located

    OPTIONAL PARAMETERS

    # gap

    Sampling gap threshold for 'acquisition restart' detection (seconds, default = 1).

    # ignoreEvents

    Set to 'true' if NEV files incorrectly list acquisition start/stop events
    (default = false).

- name: ndm_smr2dat
  parameters:
  - {name: reverse,          value: 'true', status: Mandatory}
  - {name: suffixes,         value: ~,      status: Mandatory}
  - {name: channelsExcluded, value: ~,      status: Mandatory}
  help: |-
    Convert from .smr (CED files) to .dat format.

    PARAMETERS

    # reverse

    Whether the signals should be reversed

    # suffixes

    List of suffixes for the individual files to convert

    # channelsExcluded

    List of channels to exclude for each individual file (type - for none)

- name: ndm_nev2evt
  parameters:
  - {name: suffixes, value: nlx, status: Mandatory}
  # - {name: gap, value: 1, status: Optional}
  help: |-
    Convert from .nev (Neuralynx files) to .evt format.

    PARAMETERS

    # suffixes

    List of suffixes of the directories where the NEV files are located

    OPTIONAL PARAMETERS

    # gap

    Sampling gap threshold for 'acquisition restart' detection (seconds, default = 1).

- name: ndm_smr2evt
  parameters:
  - {name: suffixes, value: ~, status: Optional}
  - {name: rename,   value: ~, status: Optional}
  help: |-
    Convert from .smr (CED files) to .evt format.

    PARAMETERS

    # suffixes

    List of suffixes for the individual files to convert

    # rename

    Optional name of a script used to automatically rename events and event files

- name: ndm_nvt2spots
  parameters:
  - {name: suffix, value: ~, status: Mandatory}
  # - {name: gap, value: 1, status: Optional}
  help: |-
    Extract spots from .nvt (Neuralynx files).

    PARAMETERS

    # suffix

    Suffix of the directory where the NVT file is located

    OPTIONAL PARAMETERS

    # gap

    Sampling gap threshold for 'acquisition restart' detection (seconds, default = 1).

- name: ndm_tsp2sts
  parameters:
  - {name: suffix, value: ~, status: Mandatory}
  help: |-
    Extract spots timestamps from .tsp and .meta (Amplipex files).

    PARAMETERS

    # suffix

    Suffix of the directory where the TSP and META files are located

- name: ndm_smi2sts
  parameters:
  - {name: suffix, value: ~, status: Mandatory}
  # - {name: gap, value: 1, status: Optional}
  help: |-
    Extract spots timestamps from .smi (Neuralynx files).

    WARNING: Neuralynx systems do not control MPEG video streams; video timing
    accuracy may be poor (up to hundreds of milliseconds of offset). Use only
    when no useable NVT file is available.

    PARAMETERS

    # suffix

    Suffix of the directory where the SMI file is located

    OPTIONAL PARAMETERS

    # gap

    Sampling gap threshold for 'acquisition restart' detection (seconds, default = 1).

# == Video ====================================================================
- name: ndm_extractleds
  parameters:
  - {name: suffix,         value: ~,       status: Mandatory}
  - {name: useTrackerData, value: 'true',  status: Mandatory}
  - {name: threshold,      value: 90,      status: Mandatory}
  - {name: extension,      value: avi,     status: Mandatory}
  - {name: show,           value: 'false', status: Mandatory}
  help: |-
    Extract LEDs (= bright spots) from a video file.

    PARAMETERS

    # suffix

    Suffix of the directory where the video file is located

    # useTrackerData

    Extract positions from the online tracking file (true, Neuralynx NVT) or
    from the video file (false)

    # threshold

    Bright spots consist of pixels brighter than this threshold (0-255)

    # extension

    Extension of the video file (e.g. avi, mpg)

    # show

    Display the video during LED extraction (false = faster, default)

- name: ndm_transcodevideo
  parameters:
  - {name: suffix,    value: ~,   status: Mandatory}
  - {name: extension, value: avi, status: Mandatory}
  - {name: codec,     value: ~,   status: Mandatory}
  # - {name: frequency, value: 30, status: Optional}
  help: |-
    Transcode video file (convert to a different codec).

    PARAMETERS

    # suffix

    Suffix of the directory where the video files to transcode are located

    # extension

    Extension of the original video file (e.g. avi, mpg)

    # codec

    Output file codec: x264 (MPEG-4 AVC) or m1v (video-only MPEG-1).
    Leave empty if no transcoding is required.

    OPTIONAL PARAMETERS

    # frequency

    Output frame rate in frames per second (default = 30)

# == Data preparation =========================================================
- name: ndm_concatenate
  parameters:
  - {name: spotsSamplingRate, value: 50, status: Mandatory}
  # - {name: maxShift, value: 3, status: Optional}
  help: |-
    Concatenate all session files (.dat, .pos and .evt) recorded on the same day.

    PARAMETERS

    # spotsSamplingRate

    Sampling rate for .spots files, i.e. original sampling rate for video or
    tracker data (if absent, time shifts between wideband and video are not
    reported, but concatenation proceeds normally).

    OPTIONAL PARAMETERS

    # maxShift

    If wideband and position sample durations differ by more than this threshold
    (in seconds, default = 3), a warning is emitted.

- name: ndm_extractchannels
  parameters:
  - {name: nChannels, value: ~, status: Mandatory}
  - {name: channels,  value: ~, status: Mandatory}
  help: |-
    Extract channels from .dat file (remove those not listed).

    PARAMETERS

    # nChannels

    Number of channels in the initial .dat file (before extraction)

    # channels

    Space-separated list of channels to extract, numbered from 0

- name: ndm_mergedat
  parameters:
  - {name: suffixes,  value: ~, status: Mandatory}
  - {name: nChannels, value: ~, status: Mandatory}
  help: |-
    Merge multiple .dat files recorded simultaneously.

    PARAMETERS

    # suffixes

    List of suffixes for the individual files to merge

    # nChannels

    Space-separated list of channel counts in individual files (one per suffix)

- name: ndm_resample
  parameters:
  - {name: suffixes,      value: ~, status: Mandatory}
  - {name: samplingRates, value: ~, status: Mandatory}
  - {name: nChannels,     value: ~, status: Mandatory}
  help: |-
    Resample individual .dat files from their original sampling rates to the
    common sampling rate of the final .dat file.

    PARAMETERS

    # suffixes

    List of suffixes for the individual files to resample

    # samplingRates

    Space-separated list of original sampling rates (one per suffix)

    # nChannels

    Space-separated list of channel counts in the individual files (one per suffix)

- name: ndm_rescale
  parameters:
  - {name: suffixes,       value: ~, status: Mandatory}
  - {name: scalingFactors, value: ~, status: Mandatory}
  help: |-
    Rescale individual .dat files from their original input ranges to the
    common range (smallest).

    PARAMETERS

    # suffixes

    List of suffixes for the individual files to rescale

    # scalingFactors

    Comma-separated list of scaling factors (< 1.0, one per suffix)

- name: ndm_reorderchannels
  parameters:
  - {name: channels, value: ~, status: Mandatory}
  help: |-
    Reorder channels in .dat file.

    PARAMETERS

    # channels

    Space-separated list of reordered channel indices (0-based)

# == Group setup ==============================================================
- name: ndm_setupgroups
  parameters:
  - {name: nSamples,         value: 52,    status: Optional}
  - {name: peakSampleIndex,  value: 26,    status: Optional}
  - {name: nFeatures,        value: 3,     status: Optional}
  - {name: probeLibrary,     value: '',    status: Optional}
  - {name: overwrite,        value: false, status: Optional}
  help: "Build anatomicalDescription and spikeDetection channel groups from the probe\
    \ library entries declared in probes:.\n\nMust be run BEFORE ndm_extractspikes.\
    \ Reads each .probe file listed in the probes: section, creates one anatomical\
    \ group and one spikeDetection group per shank, and writes both into the session\
    \ YAML in-place.  The spikeDetection groups mirror the anatomical groups exactly\
    \ (same channel order) and are annotated with nSamples / peakSampleIndex /\
    \ nFeatures.\n\nprobeId and shankIndex metadata are written into each anatomical\
    \ group entry so that ndm_estimatedrift can reconstruct probe geometry without\
    \ re-reading the probe library.\n\nChannel assignment: if channelMap.map is null\
    \ (all NeuroNexus files), channels are assigned sequentially:\n  shank i →\
    \ [offset + i*n_per_shank, …, offset + (i+1)*n_per_shank − 1]\nwhere offset\
    \ = probes[].channelOffset.\n\nOPTIONAL PARAMETERS\n\n# nSamples\nTotal waveform\
    \ window width in samples (default = 52; use 32 at 20 kHz).\n\n# peakSampleIndex\n\
    0-based index of the expected spike peak within the window (default = 26,\
    \ i.e. midpoint of a 52-sample window).\n\n# nFeatures\nPCA components per\
    \ channel for ndm_pca / ndm_klustakwik (default = 3).\n\n# probeLibrary\n\
    Override probe library search path.  Default search order:\n  /usr/share/neurosuite/probes/,\
    \ /usr/local/share/neurosuite/probes/,\n  ~/.local/share/neurosuite/probes/,\
    \ $NEUROSUITE_PROBE_PATH, SESSION_DIR/probes/\n\n# overwrite\nIf false (default),\
    \ abort if groups already exist.  Set to true to replace them."

# == Spike detection pipeline =================================================
- name: ndm_spikegrouper
  parameters:
  - {name: thresholdFactor, value: 3.0, status: Mandatory}
  - {name: refractoryMs,    value: 1.0, status: Mandatory}
  - {name: coincidenceMs,   value: 0.4, status: Mandatory}
  - {name: windowSec,       value: 60,  status: Mandatory}
  - {name: maxSubGroups,    value: 16,  status: Mandatory}
  - {name: minChannels,     value: 4,   status: Mandatory}
  - {name: maxMergedSize,   value: 12,  status: Mandatory}
  - {name: channelOverlap,  value: 0,   status: Mandatory}
  # - {name: excludeChannels, value: '', status: Optional}
  help: |-
    Discover optimal spikeDetection channel groups from the high-pass filtered
    .fil file and write them back to the YAML parameter file.

    Run AFTER ndm_hipass, BEFORE ndm_extractspikes.
    Rewrites only spikeDetection.channelGroups; anatomicalDescription is unchanged.

    PARAMETERS

    # thresholdFactor

    Spike detection threshold multiplier: threshold = factor * median(|x|)/0.6745.
    Should match or be slightly lower than ndm_extractspikes > thresholdFactor.

    # refractoryMs

    Minimum time (ms) between two consecutive detections on one channel (default 1.0).

    # coincidenceMs

    Half-width (ms) of the coincidence window for estimating channel co-activation.
    0.4 ms suits 30 kHz recordings (default 0.4).

    # windowSec

    Seconds of .fil data used for coincidence estimation (default 60).

    # maxSubGroups

    Upper bound on cluster count tested per shank. The silhouette score selects
    the best k in [1, maxSubGroups]. For high-density probes (64-128 ch/shank)
    use 16-24; the default of 16 is sufficient for tetrodes.

    # minChannels

    Minimum channels per group after clustering and merging (default 4).

    # maxMergedSize

    Hard upper limit on a merged group's channel count (default 12).
    Must be >= 2 * minChannels.

    # channelOverlap

    Channels borrowed from each neighbouring group's boundary (default 0 = disabled).
    For high-density probes an overlap of 2-4 reduces boundary split artefacts.

    OPTIONAL PARAMETERS

    # excludeChannels

    Comma-separated list of channel indices to exclude from all groups before
    processing (e.g. broken contacts or reference channels). Default: empty.

- name: ndm_hipass
  parameters:
  - {name: windowHalfLength, value: 16,        status: Mandatory}
  - {name: chunkSize,        value: 134217728,  status: Mandatory}
  help: |-
    High-pass filter a .dat file (required for spike extraction).

    Uses a median-based (non-linear) filter to minimise spike waveform distortion.

    PARAMETERS

    # windowHalfLength

    Half-length (samples) of the median filter window; determines the cutoff
    frequency. At 32 kHz, 16 samples gives approximately a 600 Hz cutoff.

    # chunkSize

    Bytes of .dat data processed per pass (default 134217728 = 128 MiB).
    Reduce if RAM is limited. Capped internally at 512 MiB to prevent OOM.

- name: ndm_denoiseuniform
  parameters:
  - {name: uniformityThreshold, value: 0.30, status: Optional}
  - {name: minAmplitude,        value: 0,    status: Optional}
  - {name: removeFlat,          value: 1,    status: Optional}
  - {name: dryRun,              value: 0,    status: Optional}
  help: |-
    Remove electrically uniform noise events from spike data.

    Run AFTER ndm_extractspikes, BEFORE ndm_pca.
    Backs up original .res and .spk files to SESSION_denoise_backup/ before
    modifying them.

    OPTIONAL PARAMETERS

    # uniformityThreshold

    Spatial uniformity score below which a waveform is classified as uniform noise
    and removed. Score near 0 = all channels identical (noise); near 1 = maximally
    diverse (genuine spike). Increase to remove more events (default 0.30).

    # minAmplitude

    Minimum peak ADC count required before attempting scoring. Spikes quieter than
    this are never removed. Set to 0 to score all spikes (default 0 -- disabled).

    # removeFlat

    Also remove near-zero AC energy waveforms (flat-line artefacts) (default 1).

    # dryRun

    Report which spikes would be removed without modifying files. Useful for
    tuning uniformityThreshold (default 0).

- name: ndm_extractspikes
  parameters:
  - {name: thresholdFactor,  value: 1.5, status: Mandatory}
  - {name: refractoryPeriod, value: 25,  status: Mandatory}
  - {name: peakSearchLength, value: 50,  status: Mandatory}
  - {name: start,            value: 0,   status: Mandatory}
  - {name: duration,         value: 60,  status: Mandatory}
  # - {name: memCapGB, value: 2, status: Optional}
  help: |-
    Extract spikes from high-pass filtered .fil file (creates .res and .spk files).

    PARAMETERS

    # thresholdFactor

    Threshold = thresholdFactor * baseline noise level (computed from a data subset)

    # refractoryPeriod

    Number of samples to skip after each detected spike

    # peakSearchLength

    Length of the peak search window (samples)

    # start

    Starting point in the file (seconds) for baseline noise computation

    # duration

    Duration (seconds) for baseline noise computation

    OPTIONAL PARAMETERS

    # memCapGB

    Memory cap in GB for the extraction process (default = 2)

- name: ndm_extractspikes_sdiff
  parameters:
  - {name: thresholdFactor,  value: 1.5, status: Mandatory}
  - {name: refractoryPeriod, value: 16,  status: Mandatory}
  - {name: peakSearchLength, value: 32,  status: Mandatory}
  - {name: start,            value: 0,   status: Mandatory}
  - {name: duration,         value: 60,  status: Mandatory}
  - {name: sdiffOrder,       value: 2,   status: Optional}
  # - {name: memCapGB, value: 2, status: Optional}
  help: |-
    Extract spikes using the spatial derivative across probe channels to suppress
    common-mode noise before threshold detection.

    Drop-in replacement for ndm_extractspikes. Detection uses the spatially
    differentiated signal; waveform extraction writes original un-differentiated
    data to .spk files so PCA and clustering see raw amplitudes.

    Channel order in each spikeDetection group should follow physical probe order
    (tip-to-base) so that spatial neighbours are adjacent.

    PARAMETERS

    # thresholdFactor

    Threshold = thresholdFactor * noise estimate of the spatial-derivative signal.

    # refractoryPeriod

    Minimum number of samples between consecutive spikes.

    # peakSearchLength

    Length of the peak-search window (samples).

    # start

    Starting point in the file (seconds) for baseline noise computation.

    # duration

    Duration (seconds) for baseline noise computation.

    OPTIONAL PARAMETERS

    # sdiffOrder

    Spatial derivative order: 0 = none, 1 = first difference,
    2 = discrete Laplacian (default -- recommended for high-density probes).

    # memCapGB

    Memory cap in GB for the process (default = 2).

- name: ndm_stripdat
  parameters:
  - {name: redetectSpikes, value: 'no', status: Optional}
  help: |-
    Strip spike waveforms from the raw .dat file to produce a spike-cleaned
    recording: <session>-spkclean.dat

    The original .dat is never modified.  Unlike most pipeline outputs,
    session-spkclean.dat is always overwritten on re-run so the file can be
    regenerated after each sorting pass without manual cleanup.

    Run AFTER spike sorting (.clu.N files must be present for template modelling).
    ndm_lfp will automatically use session-spkclean.dat when it is present.

    SUBTRACTION MODEL

    When .clu.N files are present, per-cluster template modelling is used:
      - Asymmetric-exponential PC1 waveform model
      - Contamination exclusion (overlapping spike windows excluded from
        template estimation; trimmed-mean fallback when too few clean spikes)
      - ISI-driven dual-template burst shape compensation
      - Projection-based amplitude scaling
    When no .clu.N exists for a group, raw .spk.N waveforms are subtracted.

    OPTIONAL PARAMETERS

    # redetectSpikes

    Whether to immediately run a second round of spike detection on the
    cleaned dat after writing it.

      no   Write session-spkclean.dat and stop (default).
      yes  Call ndm_redetectspikes: high-pass filters cleaned dat, detects
           missed spikes, merges into .res.N/.spk.N/.clu.N (new spikes get
           cluster ID 0), deletes stale .fet.N, removes the cleaned dat.
           After this, re-run ndm_pca and ndm_klustakwik.

    TYPICAL ITERATIVE WORKFLOW

      ndm_extractspikes   → ndm_pca → ndm_klustakwik → (klusters)
      ndm_stripdat                     # first strip with initial .clu files
      ndm_redetectspikes               # find missed spikes
      ndm_pca → ndm_klustakwik → (klusters)
      ndm_stripdat                     # re-strip with improved .clu files
      ndm_lfp                          # LFP from the final cleaned dat

- name: ndm_redetectspikes
  parameters: []
  help: |-
    Second-round spike detection on the spike-cleaned dat produced by
    ndm_stripdat.

    Run AFTER ndm_stripdat.  Reads session-spkclean.dat, high-pass filters it
    using windowHalfLength (from ndm_hipass parameters), detects spikes using
    the existing thresholdFactor / refractoryPeriod / peakSearchLength, then
    merges the new spikes into the existing .res.N/.spk.N/.clu.N files.  New
    spikes receive cluster ID 0 (unclassified).  Stale .fet.N files are deleted.
    The cleaned dat and its filtered version are removed when done.

    All parameters are inherited from the session parameter file; no additional
    parameters are needed beyond what ndm_hipass and ndm_extractspikes already
    require.

    NEXT STEPS

    Re-run ndm_pca and ndm_klustakwik (or use klusters) to sort the merged
    spike set.

- name: ndm_lfp
  parameters:
  - {name: samplingRate,   value: 1250,   status: Mandatory}
  - {name: subtractSpikes, value: 'auto', status: Optional}
  help: |-
    Downsample a .dat file to create the LFP file.

    If session-spkclean.dat already exists (produced by ndm_stripdat), it is
    used as the resampling source instead of the raw .dat.  No additional
    configuration is needed; just run ndm_stripdat before ndm_lfp.

    The subtractSpikes parameter controls what happens when no cleaned dat is
    present:

      auto  Run ndm_stripdat first if .spk.N files exist (default).
      yes   Always run ndm_stripdat; error if .spk.N files are missing.
      no    Resample from the raw .dat unconditionally.

    When ndm_lfp invokes ndm_stripdat internally (auto/yes), the cleaned dat
    is removed once the LFP file has been written.  If ndm_stripdat was run
    separately beforehand, the file is left in place for ndm_redetectspikes
    or further use.

    PARAMETERS

    # samplingRate

    Target sampling rate in Hz (default = 1250 Hz).
    Should match fieldPotentials.lfpSamplingRate.

    OPTIONAL PARAMETERS

    # subtractSpikes

    Whether to strip spikes before resampling (see above).

- name: ndm_pca
  parameters:
  - {name: before, value: 12,      status: Mandatory}
  - {name: after,  value: 12,      status: Mandatory}
  - {name: extra,  value: 'false', status: Mandatory}
  help: |-
    Compute principal component analysis (PCA) to produce .fet files for sorting.

    PARAMETERS

    # before

    Samples before the waveform peak to include in PCA. Either a single value for
    all groups or a space-separated list (one per group). Default = 12.

    # after

    Samples after the waveform peak. Same format as before. Default = 12.

    # extra

    If true, include the spike peak value as an extra feature in the .fet file.

- name: ndm_klustakwik
  parameters:
  # ── Cluster count ──────────────────────────────────────────────────────────
  - {name: minClusters,          value: 2,       status: Optional}
  - {name: maxClusters,          value: 100,     status: Optional}
  - {name: maxPossibleClusters,  value: 500,     status: Optional}
  # ── Initialisation ─────────────────────────────────────────────────────────
  - {name: nStarts,              value: 3,       status: Optional}
  - {name: initMethod,           value: farthest, status: Optional}
  - {name: penaltyMix,           value: 0,       status: Optional}
  # ── Chunked CEM ────────────────────────────────────────────────────────────
  - {name: chunkMinutes,         value: 10,      status: Optional}
  - {name: chunkOverlapMinutes,  value: 2,       status: Optional}
  - {name: chunkPreseedFraction, value: 0.05,    status: Optional}
  # ── Merge / split ──────────────────────────────────────────────────────────
  - {name: mergeThresh,          value: 42.0,    status: Optional}
  - {name: globalMergeIter,      value: 50,      status: Optional}
  - {name: timeMergeIter,        value: 50,      status: Optional}
  - {name: splitEvery,           value: 25,      status: Optional}
  # ── CEM convergence ────────────────────────────────────────────────────────
  - {name: maxIter,              value: 500,     status: Optional}
  - {name: distThresh,           value: 6.9,     status: Optional}
  - {name: fullStepEvery,        value: 10,      status: Optional}
  - {name: changedThresh,        value: 0.05,    status: Optional}
  # ── Post-sorting realignment ────────────────────────────────────────────────
  - {name: postRealign,          value: 1,       status: Optional}
  - {name: postRealignIter,      value: 2,       status: Optional}
  # ── Waveform ───────────────────────────────────────────────────────────────
  - {name: nbSamplesPerSpike,    value: 32,      status: Optional}
  # ── Output / logging ───────────────────────────────────────────────────────
  - {name: log,                  value: 1,       status: Optional}
  - {name: screen,               value: 0,       status: Optional}
  - {name: fSaveModel,           value: 1,       status: Optional}
  - {name: saveIntermediates,    value: 0,       status: Optional}
  # ── Re-run control ─────────────────────────────────────────────────────────
  - {name: overwrite,            value: 0,       status: Optional}
  # ── Parallelism ─────────────────────────────────────────────────────────────
  - {name: nThreads,             value: 0,       status: Optional}
  help: |-
    Run KlustaKwik automatic spike sorting for each spikeDetection group.

    Reads .fet.N files from ndm_pca and writes .clu.N cluster assignment files.
    Groups for which a .clu.N already exists are skipped unless overwrite: 1.

    All parameters are Optional and use the three-tier resolution:
      spikeDetection.channelGroups[g].klustakwik.<param>  (per-group, highest)
      programs[ndm_klustakwik].parameters.<param>          (global session)
      built-in default shown below                         (lowest)

    CLUSTER COUNT

    # minClusters

    Minimum clusters passed to KlustaKwik -MinClusters (default 2).

    # maxClusters

    Maximum clusters to fit. Tetrodes: 12-20; high-density probes: 50-100
    (default 100).

    # maxPossibleClusters

    Hard upper bound on the internal cluster table; must be >= maxClusters.
    Increase for very large recordings (default 500).

    INITIALISATION

    # nStarts

    Number of random restarts; best log-likelihood solution is kept (default 3).

    # initMethod

    Cluster centre initialisation: "farthest" (default) or "random".

    # penaltyMix

    Penalty mix for the CEM objective; 0 = BIC penalty (default 0).

    CHUNKED CEM

    # chunkMinutes

    Duration (minutes) of each temporal chunk. 0 disables chunking and uses
    standard two-phase CEM on the full recording (default 10).

    # chunkOverlapMinutes

    Overlap (minutes) added at each chunk boundary to smooth transitions
    (default 2).

    # chunkPreseedFraction

    Fraction of spikes used in a fast Phase-0 preseed pass to initialise cluster
    centres before per-chunk CEM; 0 disables preseeding (default 0.05).

    MERGE / SPLIT

    # mergeThresh

    Maximum Mahalanobis distance for merging cluster pairs across chunks.
    Must be calibrated to chi²(nDims, p): for 25 dims, chi²(25, 0.99) ≈ 44.3.
    A warning is emitted when this exceeds 1.5× chi²(nDims, 0.9999) (default 42.0).

    # globalMergeIter

    EM iterations run on the globally merged model after all chunks are combined
    (default 50).

    # timeMergeIter

    Phase-2 temporal merge iterations in two-phase CEM mode; 0 disables
    (default 50).

    # splitEvery

    CEM iterations between split attempts (default 25).

    CEM CONVERGENCE

    # maxIter

    Maximum CEM iterations per chunk (default 500).

    # distThresh

    Mahalanobis distance threshold for assigning spikes to clusters (default 6.9).

    # fullStepEvery

    Full E-step recomputed every N iterations; partial steps used otherwise
    (default 10).

    # changedThresh

    Fractional change in cluster assignments below which CEM is considered
    converged (default 0.05).

    POST-SORTING REALIGNMENT

    # postRealign

    Run xcorr-based waveform realignment after sorting (1 = yes, 0 = no,
    default 1).

    # postRealignIter

    Number of realignment passes (default 2).

    WAVEFORM

    # nbSamplesPerSpike

    Waveform window width in samples; must match nSamples in spikeDetection
    (default 32).

    OUTPUT / LOGGING

    # log

    Write KlustaKwik log file (1 = yes, 0 = no, default 1).

    # screen

    Print progress to stdout (1 = yes, 0 = no, default 0).

    # fSaveModel

    Save the fitted mixture model to disk (1 = yes, 0 = no, default 1).

    # saveIntermediates

    Write .clu.N each time a new best score is found during CEM
    (1 = yes, 0 = no, default 0).

    RE-RUN CONTROL

    # overwrite

    If 1, delete an existing .clu.N and re-sort. If 0 (default), skip groups
    whose .clu.N already exists. Can be set per-group in
    spikeDetection.channelGroups[g].klustakwik.overwrite.

    PARALLELISM

    # nThreads

    Number of OpenMP threads passed to KlustaKwik via OMP_NUM_THREADS.
    KlustaKwik has no -nThreads flag; the value is exported into its environment
    before launch and unset afterwards so it does not leak to other tools.
    0 (default) = use all available cores (nproc). Set explicitly only when you
    need to leave cores free for other concurrent work.


- name: ndm_estimatedrift
  parameters:
  - {name: windowSec,    value: 60,      status: Optional}
  - {name: minUnits,     value: 3,       status: Optional}
  - {name: minSpikes,    value: 20,      status: Optional}
  - {name: excludeNoise, value: 'true',  status: Optional}
  - {name: probeLibrary, value: ~,       status: Optional}
  help: |-
    Estimate in-vivo spatial probe drift from curated spike-sorting results.

    Must be run AFTER spike sorting (ndm_klustakwik) and manual curation in Klusters.
    Requires .res.N, .clu.N, and (for full accuracy) .spk.N files for each spike group.

    The plugin reads the curated cluster files and, using the electrode site geometry
    from the .probe configuration files declared under the probes: section of this YAML,
    computes the waveform amplitude fingerprint for each well-isolated unit on each shank.
    By tracking how those fingerprints shift over successive time windows, the algorithm
    estimates the in-vivo drift of each probe shank in micrometres.

    The result is written to SESSION.drift (YAML format) and can be used to flag sessions
    with excessive drift (>10-15 um/h) or to provide correction parameters for post-hoc
    spike re-assignment.

    OPTIONAL PARAMETERS

    # windowSec

    Time window length in seconds for drift computation (default = 60).

    # minUnits

    Minimum number of well-isolated units per shank to compute drift (default = 3).

    # minSpikes

    Minimum spikes a unit must fire in a given window to be included (default = 20).

    # excludeNoise

    Exclude cluster 0 (artifact) and cluster 1 (MUA) from drift computation
    (default = true).

    # probeLibrary

    Override the probe library search path. Searches NEUROSUITE_PROBE_PATH,
    ~/.local/share/neurosuite/probes/, /usr/share/neurosuite/probes/, and
    ./probes/ by default.

- name: ndm_applydrift
  parameters:
  - {name: sourceGroup,     value: 1,       status: Optional}
  - {name: threshUm,        value: 5.0,     status: Optional}
  - {name: minChunkSec,     value: 30.0,    status: Optional}
  - {name: runKlustaKwik,   value: 'false', status: Optional}
  - {name: minClusters,     value: 2,       status: Optional}
  - {name: maxClusters,     value: 100,     status: Optional}
  - {name: mergeThresh,     value: 35,      status: Optional}
  - {name: globalMergeIter, value: 30,      status: Optional}
  - {name: timeMergeIter,   value: 35,      status: Optional}
  help: |-
    Apply the drift timeseries estimated for a curated shank to its sibling
    groups on the same probe.

    Must be run AFTER ndm_estimatedrift.  Reads SESSION.drift and writes
    adaptive chunk boundary files (SESSION.chunks.N) for each target spike
    group.  KlustaKwik can then use these chunk files to align cluster
    boundaries with drift events, improving sorting quality on drifting shanks.

    Usage:
      ndm_applydrift [parameter-file] [source-group] [target-groups...]

    source-group and target-groups can also be supplied as positional
    command-line arguments; values in this parameters block are used as
    defaults when the arguments are omitted.

    OPTIONAL PARAMETERS

    # sourceGroup

    1-based index of the spike group whose curated .clu was used to generate
    SESSION.drift (default = 1).

    # threshUm

    Maximum drift per chunk in µm before a new chunk boundary is inserted
    (default = 5.0).

    # minChunkSec

    Minimum chunk duration in seconds; prevents excessively short chunks in
    periods of rapid drift (default = 30.0).

    # runKlustaKwik

    Re-run KlustaKwik for each target group immediately after writing chunk
    files (default = false).  When true, the parameters below are forwarded
    to KlustaKwik.

    # minClusters / maxClusters

    KlustaKwik -MinClusters / -MaxClusters (defaults 2 / 100).

    # mergeThresh / globalMergeIter / timeMergeIter

    KlustaKwik merge parameters (defaults 35 / 30 / 35).

- name: ndm_decomposecollisions
  parameters:
  - {name: maxShiftSamp,      value: 10,      status: Optional}
  - {name: corrThreshold,     value: 0.85,    status: Optional}
  - {name: residualThreshold, value: 0.25,    status: Optional}
  - {name: minSnrRms,         value: 4.0,     status: Optional}
  - {name: minSpikesTemplate, value: 30,      status: Optional}
  - {name: excludeNoise,      value: 'true',  status: Optional}
  - {name: overwrite,         value: 'false', status: Optional}
  help: |-
    Detect and decompose spike collision waveforms into single-unit components.

    Must be run AFTER spike sorting (ndm_klustakwik) and manual curation in Klusters.
    Requires .clu.N, .res.N, and .spk.N files for each spike group.

    When two neurons fire within approximately one spike-width (~1 ms), their waveforms
    sum linearly. The composite waveform lands between parent clusters in feature space
    and is typically misassigned. This plugin identifies and decomposes such collisions
    post-curation without modifying the original spike-sorting files.

    All template matching is restricted to spikes within a single spikeDetection group
    (same shank). Cross-shank collisions are not attempted.

    Results are written to SESSION.col.N (one per spikeDetection group, YAML sidecar).

    OPTIONAL PARAMETERS

    # maxShiftSamp

    Maximum temporal shift (+-samples) explored when matching templates (default = 10).
    At 32 kHz, 10 samples covers +-0.31 ms.

    # corrThreshold

    Pearson r below which a spike is flagged as a collision candidate (default = 0.85).
    Increase to 0.92 to flag only obvious collisions; decrease to 0.75 for a wider net.

    # residualThreshold

    Maximum fractional residual ||R||/||W|| for an accepted decomposition (default = 0.25).
    A value of 0.25 means the two-template model must explain >=75% of waveform energy.

    # minSnrRms

    Minimum spike amplitude in units of estimated RMS noise (default = 4.0).
    Spikes below this level are too weak to decompose reliably.

    # minSpikesTemplate

    Minimum spikes a unit must have to contribute a template (default = 30).

    # excludeNoise

    Exclude clusters 0 and 1 from template building (default = true).

    # overwrite

    Overwrite existing .col.N files (default = false).

# == Housekeeping =============================================================
- name: ndm_recolorchannels
  parameters: []
  help: |-
    Change channel display colors in a parameter file.

    This script takes its arguments on the command line rather than from the
    programs section; it is run standalone rather than via ndm_start.

    USAGE

      ndm_recolorchannels -c ch1-ch2,RRGGBB [...] SESSION.xml

      -c ch1-ch2,color   range of channel IDs (0-based) and hex color (no #)

    EXAMPLES

      # Color tetrode 1 red, tetrode 2 green
      ndm_recolorchannels -c 0-3,ff0000 -c 4-7,00ff00 session.xml

    NOTE: Only XML parameter files are supported.  For YAML sessions, edit
    the neuroscope/channels/colors section directly or use the ndmanager GUI.

- name: ndm_xml2yaml
  parameters: []
  help: |-
    Convert a legacy ndManager XML parameter file to the YAML format used by
    neurosuite-3.

    This is a one-shot migration utility; it is not part of the regular
    processing pipeline and does not read from the programs section.

    USAGE

      ndm_xml2yaml SESSION.xml [OUTPUT.yaml]

    All sections are preserved: generalInfo, acquisitionSystem,
    fieldPotentials, files, anatomicalDescription, spikeDetection, units,
    neuroscope (channel colors and offsets), and programs.  The original XML
    file is not modified.

- name: ndm_clean
  # Optional flags -- uncomment to override defaults:
  # - {name: wideband, value: 'true',  status: Optional}
  # - {name: xml,      value: 'true',  status: Optional}
  # - {name: hipass,   value: 'true',  status: Optional}
  # - {name: spots,    value: 'false', status: Optional}
  # - {name: pos,      value: 'false', status: Optional}
  help: |-
    Clean intermediate files after pre-processing is complete.

    OPTIONAL PARAMETERS

    # wideband

    Delete single-session wideband data files (default = true).

    # xml

    Delete single-session xml files (default = true).

    # hipass

    Delete the high-pass filtered data file (default = true).

    # spots

    Delete single-session spots files (default = false).

    # pos

    Delete single-session pos files (default = false).
