- name: ndm_rescale
  parameters:
  - name: suffixes
    value: null
    status: Mandatory
  - name: scalingFactors
    value: null
    status: Mandatory
  help: |-
    Rescale individual .dat files from their original input ranges to the common range (smallest).

    This is useful if data were collected at different input ranges (e.g. different recording systems, amplifiers, or settings on the same recording system), but one wants to process and cluster them together.

    PARAMETERS

    # suffixes

    List of suffixes for the individual files to resample

    # scalingFactors

    List (comma separated) of scaling factors to use for each session file. Must be smaller than 1, i.e. rescaling to the smallest input range of all.
- name: ndm_smi2sts
  parameters:
  - name: suffix
    value: null
    status: Mandatory
  help: "Extract spots timestamps from .smi (Neuralynx files).\n\n\t  WARNING: In\
    \ the absence of a useable NVT file, you may wish to extract spots from the MPEG\
    \ file(s) and timestamps from the SMI file(s), and then match them. This is what\
    \ ndm_smi2sts is for, and spots2pos will try its best to help you do this, but\
    \ the results are *not* reliable. This is because Neuralynx systems do not control\
    \ MPEG video streams. Instead, they leave the task to the operating system, which\
    \ does a very poor job as far as timing accuracy is concerned. As a result, the\
    \ video gets started after a random delay following acquisition start, and video\
    \ frames are shifted by an unpredictable amount (up to hundreds of milliseconds).\
    \ Again, in the absence of a useable NVT file, this may be your only solution,\
    \ but please keep these limitations in mind when analyzing your data.\n\nPARAMETERS\n\
    \n# suffix\n\nSuffix of the directory where the SMI file is located\n\nOPTIONAL\
    \ PARAMETERS\n\nNote: To keep the interface simpler, optional parameters have\
    \ default values and are not listed in the 'Parameters' tab; to choose custom\
    \ values, click the 'Add' button and manually add the required parameters (and\
    \ custom values) to the list.\n\n# gap\n\nA data record is considered to match\
    \ an 'acquisition restart' event if it is close in time and follows a sampling\
    \ gap exceeding this threshold (in seconds, default = 1)."
- name: ndm_start
  parameters:
  - name: suffixes
    value: nlx
    status: Mandatory
  - name: log
    value: 'false'
    status: Mandatory
  help: |-
    Perform all processing steps for a multiple sets of multiple-session recordings: format conversion, channel extraction and reordering, video transcoding and tracking, data concatenation, spike detection and extraction, etc.

    PARAMETERS

    # suffixes

    List of suffixes for the individual files to convert

    OPTIONAL PARAMETERS

    Note: To keep the interface simpler, optional parameters have default values and are not listed in the 'Parameters' tab; to choose custom values, click the 'Add' button and manually add the required parameters (and custom values) to the list.

    # wideband

    Process the wideband data files recorded by the acquisition system: convert to .dat format, resample, merge, extract and reorder channels (default = true)

    # video

    Process video files recorded by the acquisition system: transcode and extract LEDs (default = true)

    # events

    Process event files recorded by the acquisition system: convert to .evt format and rename events (default = true)

    # spikes

    Process spikes: detect and extract spike waveforms, perform PCA (default = true)

    # lfp

    Downsample wideband signals to produce LFP files (default = true)

    # clean

    Remove intermediate files after pre-processing is complete (default = false)

    # log

    Save progress information to log files for later review (use 'cat' or 'less -R' for correct formatting) (default = false)
- name: ndm_transcodevideo
  parameters:
  - name: suffix
    value: null
    status: Mandatory
  - name: extension
    value: avi
    status: Mandatory
  - name: codec
    value: null
    status: Mandatory
  help: |-
    Transcode video file (convert to a different codec).

    PARAMETERS

    # suffix

    Suffix of the directory where the video files to transcode are located

    # extension

    Extension of the original video file (e.g. avi, mpg, etc.)

    # codec

    Output file codec - possible choices include:

     * x264 (MPEG-4 AVC)
     * m1v (video-only MPEG-1)

    Leave empty if no transcoding is required
