# contract.yaml — what neurosuite-3 promises at its boundaries: to fiber-kit,
# which reads and writes the same files, and to ndm plugins.
#
#   contract        bumped when plugin_protocol, session_schema or formats change
#                   (a table change shows in vectors and needs no bump)
#   plugin_protocol the ndm-plugin-protocol ndmanager speaks
#   session_schema  parameters.version written into SESSION.yaml
#   formats         version-tagged formats: the highest version read (every
#                   version from 1 up is read) and the version written
#   vectors         MD5 of each table and reference file shared byte for byte
#                   with fiber-kit
#
# Checked against the code by core_test_contract (contract, plugin_protocol,
# session_schema, formats) and by test_shared_contract.py (vectors; with a
# fiber-kit checkout, against fiber-kit's contract.yaml).  Kept flat, in this
# layout, so both are read without a YAML library.  Changing it is a recipe in
# doc/dev/RECIPES.md §2.5.
contract: 1
repository: neurosuite-3
plugin_protocol: 1
session_schema: '1.0'
formats:
  pca: {read: 2, write: 2}
  wti: {read: 2, write: 2}
  wtl: {read: 2, write: 2}
  tcl: {read: 1, write: 1}
  eap: {read: 1, write: 1}
vectors:
